<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebCraft</title>
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --surface-2: #efece4; --ink: #1b1d22; --ink-2: #5d6068;
  --line: rgba(20,22,28,.10); --accent: #b07a1c; --accent-ink: #fff; --danger: #c0392b;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px -12px rgba(0,0,0,.18);
  --r: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --ink: #eceae4; --ink-2: #9a9ca3;
    --line: rgba(255,255,255,.08); --accent: #e8b04b; --accent-ink: #1a1405; --danger: #ff6b5e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { min-height: 100vh; padding: 0 16px 96px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.wrap { max-width: 880px; margin: 0 auto; }

header { display: flex; align-items: center; gap: 12px; padding: 22px 0 14px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.logo { width: 38px; height: 38px; border-radius: 11px; background: #141821; display: grid; place-items: center; flex: none; }
.logo svg { width: 22px; height: 22px; }
h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.01em; flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--surface-2); min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn svg { width: 18px; height: 18px; }
.btn:active, .card:active, .row:active { transform: scale(.98); }

.search { width: 100%; margin: 4px 0 14px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; outline: none; }
.search:focus { border-color: var(--accent); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); transition: transform .12s; text-align: left; width: 100%; min-height: 76px; }
.av { width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center; font: 700 21px Georgia, serif; color: #e8b04b; background: #141821; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.meta { flex: 1; min-width: 0; }
.name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.more { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.more svg { width: 22px; height: 22px; }

.empty { text-align: center; padding: 64px 20px; color: var(--ink-2); }
.empty h2 { color: var(--ink); font-size: 19px; margin: 18px 0 8px; }
.empty p { max-width: 380px; margin: 0 auto 22px; line-height: 1.5; }
.foot { margin-top: 28px; font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.link { color: var(--accent); font-weight: 600; padding: 8px 0; }

/* sheets + dialogs */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--surface); border-radius: 22px 22px 0 0; padding: 10px 12px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.9,.3,1); max-width: 560px; margin: 0 auto; max-height: 86vh; overflow: auto; }
.sheet.on { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 0 8px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 10px; border-radius: 12px; text-align: left; font-size: 15px; min-height: 48px; }
.row svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.row .hint { margin-left: auto; font-size: 13px; color: var(--ink-2); }
.row.danger, .row.danger svg { color: var(--danger); }
.sep { height: 1px; background: var(--line); margin: 6px 10px; }
.switch { margin-left: auto; width: 42px; height: 26px; border-radius: 99px; background: var(--surface-2); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-2); transition: transform .2s, background .2s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); background: var(--accent-ink); }

.dialog { position: fixed; left: 50%; top: 50%; z-index: 12; width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 20px; padding: 20px; transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: .18s; box-shadow: var(--shadow); }
.dialog.on { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
.dialog h3 { margin: 0 0 8px; font-size: 18px; }
.dialog p { margin: 0 0 14px; color: var(--ink-2); line-height: 1.45; font-size: 14.5px; }
.dialog input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; outline: none; margin-bottom: 14px; }
.dialog input:focus { border-color: var(--accent); }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn.danger { background: var(--danger); color: #fff; }

/* editor */
.editor { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; }
.editor.on { display: flex; }
.ed-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ed-bar .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
.ed-bar .dot.on { display: inline-block; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.icon-btn svg { width: 22px; height: 22px; }
textarea { flex: 1; width: 100%; border: 0; resize: none; outline: none; padding: 14px 14px 40vh; background: var(--bg); color: var(--ink); font: 13px/1.55 ui-monospace, "JetBrains Mono", "Droid Sans Mono", monospace; tab-size: 2; white-space: pre; overflow: auto; }
.ed-status { font-size: 12px; color: var(--ink-2); padding: 6px 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; z-index: 30; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#e8b04b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg></div>
    <h1>WebCraft</h1>
    <button class="btn" id="newBtn" aria-label="New app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="btn primary" id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>Import</button>
  </header>
  <input class="search" id="search" type="search" placeholder="Search apps" hidden>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 10-2 2 2 2m4-4 2 2-2 2"/></svg>
    <h2>Turn HTML files into apps</h2>
    <p>Import a single-file HTML page (for example from your Download folder). It runs full-screen, keeps its saved data, works offline, and can go on your home screen like a real app.</p>
    <button class="btn primary" id="importBtn2">Import HTML file</button>
  </div>
  <div class="foot" id="foot" hidden>
    <span id="cacheInfo"></span>
    <button class="link" id="clearCache">Clear offline cache</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><div class="av" id="shAv"></div><div class="meta"><div class="name" id="shName"></div><div class="sub" id="shSub"></div></div></div>
  <button class="row" data-act="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>Open</button>
  <button class="row" data-act="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><path d="M16.5 14v6M13.5 17h6"/></svg>Add to home screen</button>
  <button class="row" data-act="full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Hide status &amp; navigation bars<span class="switch" id="fullSw"></span></button>
  <div class="sep"></div>
  <button class="row" data-act="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>Edit code</button>
  <button class="row" data-act="rename"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Rename</button>
  <button class="row" data-act="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 14v5h14v-5"/></svg>Export HTML file</button>
  <button class="row" data-act="unlink" id="unlinkRow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6M10 6l1-1a4 4 0 0 1 6 6l-1 1M14 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>Stop syncing with file<span class="hint">auto-updates now</span></button>
  <div class="sep"></div>
  <button class="row" data-act="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Back up saved data</button>
  <button class="row" data-act="restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6"/></svg>Restore saved data</button>
  <div class="sep"></div>
  <button class="row danger" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button>
</div>

<div class="dialog" id="dialog" role="dialog" aria-modal="true">
  <h3 id="dlgTitle"></h3>
  <p id="dlgText"></p>
  <input id="dlgInput" autocomplete="off">
  <div class="actions"><button class="btn" id="dlgCancel">Cancel</button><button class="btn primary" id="dlgOk">OK</button></div>
</div>

<div class="editor" id="editor">
  <div class="ed-bar">
    <button class="icon-btn" id="edClose" aria-label="Close editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="dot" id="edDot"></span><span class="title" id="edTitle"></span>
    <button class="btn" id="edSave">Save</button>
    <button class="btn primary" id="edRun">Run</button>
  </div>
  <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
  <div class="ed-status"><span id="edLines"></span><span id="edSize"></span></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var WC = window.WC;
  var apps = [], cur = null, edId = null, dirty = false;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function kb(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
  function ago(t) {
    if (!t) return 'never opened';
    var s = (Date.now() - t) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    if (s < 604800) return Math.floor(s / 86400) + ' d ago';
    return new Date(t).toLocaleDateString();
  }
  function initial(n) { var c = Array.from((n || '?').trim())[0] || '?'; return c.toUpperCase(); }
  function lum(hex) {
    var n = parseInt(hex.slice(1), 16);
    return (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255;
  }
  function avatar(el, a) {
    el.textContent = initial(a.name);
    if (a.hex) { el.style.background = a.hex; el.style.color = lum(a.hex) > .6 ? '#222' : '#e8b04b'; }
    else { el.style.background = ''; el.style.color = ''; }
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  function load() {
    try { apps = JSON.parse(WC.list()); } catch (e) { apps = []; }
    render();
  }
  function render() {
    var q = $('search').value.trim().toLowerCase();
    var list = q ? apps.filter(function (a) { return a.name.toLowerCase().indexOf(q) >= 0; }) : apps;
    $('search').hidden = apps.length < 7;
    $('empty').hidden = apps.length > 0;
    $('foot').hidden = apps.length === 0;
    $('grid').innerHTML = list.map(function (a) {
      return '<div class="card" role="button" tabindex="0" data-id="' + a.id + '">' +
        '<div class="av"></div><div class="meta"><div class="name">' + esc(a.name) + '</div>' +
        '<div class="sub">' + ago(a.opened) + ' · ' + kb(a.size) + (a.linked ? '<span class="tag">synced</span>' : '') + (a.full ? '<span class="tag">fullscreen</span>' : '') + '</div></div>' +
        '<button class="more" aria-label="More options for ' + esc(a.name) + '"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>';
    }).join('');
    var cards = $('grid').children;
    for (var i = 0; i < cards.length; i++) avatar(cards[i].querySelector('.av'), list[i]);
    try { var c = +WC.cacheInfo(); $('cacheInfo').textContent = c ? 'Offline cache: ' + kb(c) + ' of fonts & libraries' : 'Fonts and libraries are cached for offline use after first run'; } catch (e) {}
  }
  function byId(id) { for (var i = 0; i < apps.length; i++) if (apps[i].id === id) return apps[i]; return null; }

  $('grid').addEventListener('click', function (e) {
    var card = e.target.closest('.card'); if (!card) return;
    var a = byId(card.getAttribute('data-id')); if (!a) return;
    if (e.target.closest('.more')) openSheet(a); else WC.open(a.id);
  });
  $('grid').addEventListener('contextmenu', function (e) {
    var card = e.target.closest('.card'); if (!card) return;
    e.preventDefault(); var a = byId(card.getAttribute('data-id')); if (a) openSheet(a);
  });
  $('search').addEventListener('input', render);
  $('importBtn').onclick = $('importBtn2').onclick = function () { WC.importFiles(); };
  $('newBtn').onclick = function () {
    ask('New app', 'Give it a name. You can paste or write the HTML next.', 'My app', function (name) {
      var id = WC.create(name, '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="theme-color" content="#101418">\n<title>' + name.replace(/</g, '') + '</title>\n<style>\n  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101418; color: #eee; font-family: system-ui, sans-serif; }\n</style>\n</head>\n<body>\n  <h1>Hello 👋</h1>\n</body>\n</html>\n');
      load(); openEditor(byId(id));
    });
  };
  $('clearCache').onclick = function () { WC.clearCache(); render(); };

  /* sheet */
  function openSheet(a) {
    cur = a;
    avatar($('shAv'), a);
    $('shName').textContent = a.name;
    $('shSub').innerHTML = kb(a.size) + ' · opened ' + (a.opens || 0) + '×' + (a.linked ? ' <span class="tag">synced with file</span>' : '');
    $('fullSw').classList.toggle('on', !!a.full);
    $('unlinkRow').hidden = !a.linked;
    $('scrim').classList.add('on'); $('sheet').classList.add('on');
  }
  function closeSheet() { $('sheet').classList.remove('on'); if (!$('dialog').classList.contains('on')) $('scrim').classList.remove('on'); }
  $('scrim').onclick = function () { closeDialog(); closeSheet(); };
  $('sheet').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || !cur) return;
    var a = cur, act = b.getAttribute('data-act');
    if (act === 'full') { a.full = !a.full; WC.setFull(a.id, a.full); $('fullSw').classList.toggle('on', a.full); render(); return; }
    closeSheet();
    if (act === 'open') WC.open(a.id);
    else if (act === 'pin') WC.pin(a.id);
    else if (act === 'edit') openEditor(a);
    else if (act === 'export') WC.exportHtml(a.id);
    else if (act === 'backup') WC.backup(a.id);
    else if (act === 'restore') confirmBox('Restore saved data?', 'Pick a WebCraft backup (.json). Its saved items will be written into “' + a.name + '”, replacing matching ones. Close the app first if it is open.', 'Choose backup', false, function () { WC.restore(a.id); });
    else if (act === 'unlink') { WC.unlink(a.id); load(); toast('No longer syncing with the file'); }
    else if (act === 'rename') ask('Rename', '', a.name, function (n) { WC.rename(a.id, n); load(); });
    else if (act === 'delete') confirmBox('Delete “' + a.name + '”?', 'This removes the app, its home-screen icon and all of its saved data. Back up its data first if you may want it later.', 'Delete', true, function () { WC.remove(a.id); load(); toast('Deleted'); });
  });

  /* dialog */
  var dlgOk = null;
  function showDialog(title, text, value, okLabel, danger, ok) {
    $('dlgTitle').textContent = title;
    $('dlgText').textContent = text; $('dlgText').hidden = !text;
    $('dlgInput').hidden = value === null;
    if (value !== null) $('dlgInput').value = value;
    $('dlgOk').textContent = okLabel || 'OK';
    $('dlgOk').className = 'btn ' + (danger ? 'danger' : 'primary');
    dlgOk = ok;
    $('scrim').classList.add('on'); $('dialog').classList.add('on');
    if (value !== null) setTimeout(function () { $('dlgInput').focus(); $('dlgInput').select(); }, 60);
  }
  function ask(title, text, value, ok) { showDialog(title, text, value, 'Save', false, function () { var v = $('dlgInput').value.trim(); if (v) ok(v); }); }
  function confirmBox(title, text, label, danger, ok) { showDialog(title, text, null, label, danger, ok); }
  function closeDialog() { $('dialog').classList.remove('on'); if (!$('sheet').classList.contains('on')) $('scrim').classList.remove('on'); dlgOk = null; }
  $('dlgCancel').onclick = closeDialog;
  $('dlgOk').onclick = function () { var f = dlgOk; closeDialog(); if (f) f(); };
  $('dlgInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('dlgOk').onclick(); });

  /* editor */
  function stats() {
    var v = $('code').value;
    $('edLines').textContent = v.split('\n').length + ' lines';
    $('edSize').textContent = kb(new Blob([v]).size);
  }
  function setDirty(d) { dirty = d; $('edDot').classList.toggle('on', d); }
  function openEditor(a) {
    if (!a) return;
    edId = a.id;
    $('edTitle').textContent = a.name;
    $('code').value = WC.source(a.id);
    setDirty(false); stats();
    $('editor').classList.add('on');
    $('code').scrollTop = 0;
  }
  function saveEditor() { if (edId && WC.save(edId, $('code').value)) { setDirty(false); toast('Saved'); load(); } }
  function closeEditor(force) {
    if (dirty && !force) {
      confirmBox('Discard changes?', 'Your edits have not been saved.', 'Discard', true, function () { closeEditor(true); });
      return;
    }
    $('editor').classList.remove('on'); edId = null; setDirty(false);
  }
  var st = null;
  $('code').addEventListener('input', function () { setDirty(true); clearTimeout(st); st = setTimeout(stats, 300); });
  $('code').addEventListener('keydown', function (e) {
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveEditor(); }
  });
  $('edSave').onclick = saveEditor;
  $('edRun').onclick = function () { var id = edId; saveEditor(); WC.open(id); };
  $('edClose').onclick = function () { closeEditor(false); };

  /* Android back: close the topmost layer first */
  window.wcBack = function () {
    if ($('dialog').classList.contains('on')) { closeDialog(); return true; }
    if ($('sheet').classList.contains('on')) { closeSheet(); return true; }
    if ($('editor').classList.contains('on')) { closeEditor(false); return true; }
    return false;
  };
  window.wcEvent = function (name) { if (name === 'changed' && !$('editor').classList.contains('on')) load(); };

  load();
})();
</script>
</body>
</html>
